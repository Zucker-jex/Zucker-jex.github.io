<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game of Life - 高性能大尺寸版</title>
    <style>
        /* 保持原有艺术风格，新增小地图与全屏按钮样式，融入现有设计 */
        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .controls label {
            margin: auto 0;
        }
        .controls input {
            margin: auto 0;
        }
        #gameCanvas {
            border: 1px solid var(--text-color);
            background-color: var(--background-color);
            max-width: 100%;
            margin: 0 auto;
            display: block;
            cursor: grab;
            background-color: #f0f0f0;
        }
        #gameCanvas:active {
            cursor: grabbing;
        }
        .slider {
            width: 100px;
        }
        .game-container {
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            position: relative;
        }
        /* 小地图容器：绝对定位，右下角，半透明背景，不影响交互 */
        .minimap-container {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(30, 30, 40, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 10;
            cursor: pointer;
            transition: 0.2s;
        }
        .minimap-container:hover {
            background: rgba(30, 30, 40, 0.9);
        }
        #minimapCanvas {
            display: block;
            border-radius: 4px;
            border: 1px solid #aaa;
            background-color: #2c2c2c;
        }
        /* 全屏时调整小地图位置防止遮挡 */
        :-webkit-full-screen .minimap-container {
            bottom: 20px;
            right: 20px;
        }
        :-moz-full-screen .minimap-container {
            bottom: 20px;
            right: 20px;
        }
        :fullscreen .minimap-container {
            bottom: 20px;
            right: 20px;
        }
        .button {
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            background: transparent;
            transition: 0.2s;
        }
        .button--outline-success {
            border: 1px solid #28a745;
            color: #28a745;
        }
        .button--outline-info {
            border: 1px solid #17a2b8;
            color: #17a2b8;
        }
        .button--outline-warning {
            border: 1px solid #ffc107;
            color: #ffc107;
        }
        .button--outline-danger {
            border: 1px solid #dc3545;
            color: #dc3545;
        }
        .button--outline-secondary {
            border: 1px solid #6c757d;
            color: #6c757d;
        }
        .button:hover {
            opacity: 0.8;
        }
        .my-input {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 6px;
            background: var(--background-color);
            color: var(--text-color);
        }
        /* 简洁提示 */
        .shortcut-hint {
            font-size: 11px;
            margin-left: 5px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="controls">
    <label for="width">Width:</label>
    <input type="number" id="width" value="200" class="my-input" style="width: 80px;" />
    <label for="height">Height:</label>
    <input type="number" id="height" value="200" class="my-input" style="width: 80px;" />
    <button class="button button--outline-success button--rounded" onclick="initializeGame()">Set Map</button>
    <button class="button button--outline-info button--rounded" onclick="randomizeGrid()">Randomize</button>
    <button class="button button--outline-warning button--rounded" onclick="pauseGame()">Pause</button>
    <button class="button button--outline-danger button--rounded" onclick="clearGrid()">Clear</button>
    <label for="speed">Speed:</label>
    <input type="range" id="speed" min="1" max="20" value="5" class="slider" oninput="updateSpeed(this.value)" />
    
    <!-- 单元格大小控制 -->
    <label for="cellSizeSlider">Cell Size:</label>
    <input type="range" id="cellSizeSlider" min="2" max="30" value="6" class="slider" oninput="setCellSize(parseInt(this.value))" />
    <span id="cellSizeValue" style="min-width: 35px;">6px</span>
    
    <!-- 网格线开关 -->
    <label style="display: inline-flex; align-items: center;">
        <input type="checkbox" id="toggleGridCheckbox" checked onchange="toggleGridLines(this.checked)" />
        <span style="margin-left: 5px;">Grid</span>
    </label>
    
    <!-- 重置视角按钮 -->
    <button class="button button--outline-info button--rounded" onclick="resetView()">Reset View</button>
    
    <!-- 全屏按钮，新增，风格一致 -->
    <button class="button button--outline-secondary button--rounded" id="fullscreenBtn">Fullscreen (F)</button>
</div>
<div class="game-container" id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <!-- 小地图容器：绝对定位展示整体地图与视口 -->
    <div class="minimap-container" id="minimapContainer" title="点击小地图跳转到对应位置">
        <canvas id="minimapCanvas" width="150" height="150" style="width:150px; height:150px;"></canvas>
    </div>
</div>

<script>
    // ---------- 核心参数 ----------
    let width = 200;            // 世界宽度 (细胞列数)
    let height = 200;          // 世界高度 (细胞行数)
    let grid;                  // 二维数组存储细胞状态 0/1
    
    // 视口与交互
    let viewOffsetX = 0;       // 世界坐标偏移 (细胞单位), 视口左上角对应的列索引
    let viewOffsetY = 0;       // 世界坐标偏移 (细胞单位), 视口左上角对应的行索引
    let cellSizePx = 6;        // 每个细胞在画布上占用的像素大小 (可缩放)
    let showGridLines = true;   // 是否绘制网格线
    
    // 画布相关
    let canvas;
    let ctx;
    let canvasWidth = 0;
    let canvasHeight = 0;
    
    // 小地图相关
    let minimapCanvas;
    let minimapCtx;
    let minimapWidth = 150;      // 固定宽度，实际会根据地图比例动态调整绘制区域
    let minimapHeight = 150;
    
    // 游戏循环控制
    let speed = 5;
    let isPaused = false;
    let gameLoopTimeout = null;
    
    // 鼠标拖拽平移
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let dragStartOffsetX = 0, dragStartOffsetY = 0;
    
    // ---------- 辅助函数 ----------
    function createGrid(w, h) {
        let newGrid = new Array(h);
        for (let y = 0; y < h; y++) {
            newGrid[y] = new Array(w).fill(0);
        }
        return newGrid;
    }
    
    // 调整主画布尺寸
    function resizeCanvas() {
        const container = document.querySelector('.game-container');
        let maxWidth = Math.min(container.clientWidth - 20, 1400);
        let maxHeight = window.innerHeight * 0.65;
        let targetWidth = Math.max(600, Math.min(maxWidth, 1200));
        let targetHeight = Math.max(400, Math.min(maxHeight, 800));
        
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        canvasWidth = canvas.width;
        canvasHeight = canvas.height;
        
        clampViewOffset();
        drawVisible();
    }
    
    // 钳制视口偏移
    function clampViewOffset() {
        if (!grid) return;
        let visibleCols = canvasWidth / cellSizePx;
        let visibleRows = canvasHeight / cellSizePx;
        let maxOffsetX = Math.max(0, width - visibleCols);
        let maxOffsetY = Math.max(0, height - visibleRows);
        viewOffsetX = Math.min(maxOffsetX, Math.max(0, viewOffsetX));
        viewOffsetY = Math.min(maxOffsetY, Math.max(0, viewOffsetY));
        if (visibleCols >= width) viewOffsetX = 0;
        if (visibleRows >= height) viewOffsetY = 0;
    }
    
    // 重置视角
    function resetView() {
        viewOffsetX = 0;
        viewOffsetY = 0;
        clampViewOffset();
        drawVisible();
        updateMinimap();  // 刷新小地图视口框
    }
    
    // 设置单元格大小
    function setCellSize(newSize) {
        if (newSize < 2) newSize = 2;
        if (newSize > 30) newSize = 30;
        cellSizePx = newSize;
        document.getElementById('cellSizeSlider').value = cellSizePx;
        document.getElementById('cellSizeValue').innerText = cellSizePx + 'px';
        if (canvasWidth && canvasHeight) {
            clampViewOffset();
            drawVisible();
            updateMinimap(); // 视口矩形改变
        }
    }
    
    function toggleGridLines(show) {
        showGridLines = show;
        drawVisible();
    }
    
    function updateSpeed(value) {
        speed = value;
        restartGameLoop();
    }
    
    function pauseGame() {
        isPaused = !isPaused;
        drawVisible();
        restartGameLoop();
    }
    
    function clearGrid() {
        if (!grid) return;
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                grid[y][x] = 0;
            }
        }
        drawVisible();
        updateMinimap(); // 小地图更新
    }
    
    function randomizeGrid() {
        if (!grid) return;
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                grid[y][x] = Math.random() > 0.85 ? 1 : 0;
            }
        }
        drawVisible();
        updateMinimap();
    }
    
    // 邻居计数
    function countAliveNeighbors(grid, x, y, w, h) {
        let count = 0;
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                let nx = x + dx;
                let ny = y + dy;
                if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                    count += grid[ny][nx];
                }
            }
        }
        return count;
    }
    
    // 下一代计算 (全量)
    function computeNextGeneration() {
        if (!grid) return;
        let newGrid = createGrid(width, height);
        for (let y = 0; y < height; y++) {
            const row = grid[y];
            const newRow = newGrid[y];
            for (let x = 0; x < width; x++) {
                let aliveNeighbors = countAliveNeighbors(grid, x, y, width, height);
                if (row[x] === 1) {
                    newRow[x] = (aliveNeighbors === 2 || aliveNeighbors === 3) ? 1 : 0;
                } else {
                    newRow[x] = (aliveNeighbors === 3) ? 1 : 0;
                }
            }
        }
        grid = newGrid;
    }
    
    // 高性能绘制主画布 (仅绘制可见区域)
    function drawVisible() {
        if (!ctx || !grid || canvasWidth === 0) return;
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        
        let startCol = Math.floor(viewOffsetX);
        let endCol = Math.ceil(viewOffsetX + canvasWidth / cellSizePx);
        let startRow = Math.floor(viewOffsetY);
        let endRow = Math.ceil(viewOffsetY + canvasHeight / cellSizePx);
        
        startCol = Math.max(0, startCol);
        endCol = Math.min(width, endCol);
        startRow = Math.max(0, startRow);
        endRow = Math.min(height, endRow);
        
        const firstCellScreenX = - (viewOffsetX - startCol) * cellSizePx;
        const firstCellScreenY = - (viewOffsetY - startRow) * cellSizePx;
        
        const computedStyle = getComputedStyle(document.documentElement);
        let cellColor = computedStyle.getPropertyValue('--text-color').trim();
        if (!cellColor || cellColor === '') cellColor = '#2c3e50';
        let gridColor = computedStyle.getPropertyValue('--border-color').trim();
        if (!gridColor || gridColor === '') gridColor = '#dddddd';
        
        ctx.fillStyle = cellColor;
        for (let row = startRow; row < endRow; row++) {
            const gridRow = grid[row];
            const screenY = firstCellScreenY + (row - startRow) * cellSizePx;
            if (screenY > canvasHeight) break;
            if (screenY + cellSizePx < 0) continue;
            for (let col = startCol; col < endCol; col++) {
                if (gridRow[col] === 1) {
                    const screenX = firstCellScreenX + (col - startCol) * cellSizePx;
                    if (screenX + cellSizePx >= 0 && screenX <= canvasWidth) {
                        ctx.fillRect(screenX, screenY, cellSizePx, cellSizePx);
                    }
                }
            }
        }
        
        if (showGridLines) {
            ctx.beginPath();
            ctx.strokeStyle = gridColor;
            ctx.lineWidth = 0.5;
            const startXScreen = firstCellScreenX;
            for (let col = startCol; col <= endCol; col++) {
                const x = startXScreen + (col - startCol) * cellSizePx;
                if (x >= 0 && x <= canvasWidth) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvasHeight);
                    ctx.stroke();
                } else if (x > canvasWidth) break;
            }
            const startYScreen = firstCellScreenY;
            for (let row = startRow; row <= endRow; row++) {
                const y = startYScreen + (row - startRow) * cellSizePx;
                if (y >= 0 && y <= canvasHeight) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvasWidth, y);
                    ctx.stroke();
                } else if (y > canvasHeight) break;
            }
        }
    }
    
    // ---------- 小地图实现 ----------
    function resizeMinimap() {
        // 根据地图宽高比例设定小地图画布实际尺寸 (保持比例)
        let aspect = width / height;
        let drawWidth = minimapWidth;
        let drawHeight = minimapHeight;
        if (aspect > 1) {
            drawHeight = minimapWidth / aspect;
        } else {
            drawWidth = minimapHeight * aspect;
        }
        minimapCanvas.width = drawWidth;
        minimapCanvas.height = drawHeight;
        // 设置CSS显示尺寸保持一致
        minimapCanvas.style.width = `${drawWidth}px`;
        minimapCanvas.style.height = `${drawHeight}px`;
        // 重绘小地图内容
        updateMinimap();
    }
    
    function updateMinimap() {
        if (!minimapCtx || !grid) return;
        const mapW = width;
        const mapH = height;
        const mWidth = minimapCanvas.width;
        const mHeight = minimapCanvas.height;
        if (mWidth === 0 || mHeight === 0) return;
        
        // 清空
        minimapCtx.clearRect(0, 0, mWidth, mHeight);
        // 背景色浅灰
        minimapCtx.fillStyle = "#2a2a2a";
        minimapCtx.fillRect(0, 0, mWidth, mHeight);
        
        // 计算每个细胞在小地图上的像素尺寸 (可能小于1, 使用fillRect精确)
        const scaleX = mWidth / mapW;
        const scaleY = mHeight / mapH;
        
        // 优化绘制：若缩放因子太小，则直接按区域绘制，但为了清晰，仍然遍历绘制矩形（性能可接受，因为地图大时小地图分辨率低）
        // 遍历全部细胞绘制存活细胞
        minimapCtx.fillStyle = "#ffffff";
        for (let y = 0; y < mapH; y++) {
            const row = grid[y];
            for (let x = 0; x < mapW; x++) {
                if (row[x] === 1) {
                    const px = x * scaleX;
                    const py = y * scaleY;
                    const pw = Math.max(1, Math.ceil(scaleX));
                    const ph = Math.max(1, Math.ceil(scaleY));
                    minimapCtx.fillRect(px, py, pw, ph);
                }
            }
        }
        
        // 绘制视口矩形 (当前可视区域)
        const visibleCols = canvasWidth / cellSizePx;
        const visibleRows = canvasHeight / cellSizePx;
        const viewRectX = viewOffsetX * scaleX;
        const viewRectY = viewOffsetY * scaleY;
        const viewRectW = Math.min(visibleCols * scaleX, mWidth - viewRectX);
        const viewRectH = Math.min(visibleRows * scaleY, mHeight - viewRectY);
        
        minimapCtx.strokeStyle = "#ffaa44";
        minimapCtx.lineWidth = 1.5;
        minimapCtx.strokeRect(viewRectX, viewRectY, viewRectW, viewRectH);
        // 添加外发光效果
        minimapCtx.shadowBlur = 0;
    }
    
    // 点击小地图跳转：将点击位置映射到世界坐标，设为新的视口中心
    function onMinimapClick(e) {
        if (!grid) return;
        const rect = minimapCanvas.getBoundingClientRect();
        const scaleXCanvas = minimapCanvas.width / rect.width;
        const scaleYCanvas = minimapCanvas.height / rect.height;
        let clickX = (e.clientX - rect.left) * scaleXCanvas;
        let clickY = (e.clientY - rect.top) * scaleYCanvas;
        clickX = Math.min(minimapCanvas.width, Math.max(0, clickX));
        clickY = Math.min(minimapCanvas.height, Math.max(0, clickY));
        
        // 映射到世界坐标
        const worldX = (clickX / minimapCanvas.width) * width;
        const worldY = (clickY / minimapCanvas.height) * height;
        
        // 设置视口中心为点击位置
        const visibleCols = canvasWidth / cellSizePx;
        const visibleRows = canvasHeight / cellSizePx;
        let newOffsetX = worldX - visibleCols / 2;
        let newOffsetY = worldY - visibleRows / 2;
        let maxX = Math.max(0, width - visibleCols);
        let maxY = Math.max(0, height - visibleRows);
        viewOffsetX = Math.min(maxX, Math.max(0, newOffsetX));
        viewOffsetY = Math.min(maxY, Math.max(0, newOffsetY));
        clampViewOffset();
        drawVisible();
        updateMinimap();
    }
    
    // ---------- 全屏功能 ----------
    function toggleFullscreen() {
        const container = document.getElementById('gameContainer');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                console.warn(`全屏失败: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    // ---------- 游戏演化与循环 ----------
    function gameStep() {
        if (!grid) return;
        if (!isPaused) {
            computeNextGeneration();
            updateMinimap(); // 每代更新小地图
        }
        drawVisible();
    }
    
    function scheduleNext() {
        if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
        gameLoopTimeout = setTimeout(() => {
            gameStep();
            scheduleNext();
        }, 1000 / speed);
    }
    
    function restartGameLoop() {
        if (gameLoopTimeout) {
            clearTimeout(gameLoopTimeout);
            gameLoopTimeout = null;
        }
        scheduleNext();
    }
    
    function stopGameLoop() {
        if (gameLoopTimeout) {
            clearTimeout(gameLoopTimeout);
            gameLoopTimeout = null;
        }
    }
    
    // ---------- 鼠标拖拽平移逻辑 ----------
    function onMouseDown(e) {
        if (!canvas) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let mouseX = (e.clientX - rect.left) * scaleX;
        let mouseY = (e.clientY - rect.top) * scaleY;
        mouseX = Math.min(canvasWidth, Math.max(0, mouseX));
        mouseY = Math.min(canvasHeight, Math.max(0, mouseY));
        isDragging = true;
        dragStartX = mouseX;
        dragStartY = mouseY;
        dragStartOffsetX = viewOffsetX;
        dragStartOffsetY = viewOffsetY;
        canvas.style.cursor = 'grabbing';
    }
    
    function onMouseMove(e) {
        if (!isDragging || !canvas) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let currentX = (e.clientX - rect.left) * scaleX;
        let currentY = (e.clientY - rect.top) * scaleY;
        currentX = Math.min(canvasWidth, Math.max(0, currentX));
        currentY = Math.min(canvasHeight, Math.max(0, currentY));
        let deltaX = currentX - dragStartX;
        let deltaY = currentY - dragStartY;
        let deltaOffsetX = deltaX / cellSizePx;
        let deltaOffsetY = deltaY / cellSizePx;
        let newOffsetX = dragStartOffsetX - deltaOffsetX;
        let newOffsetY = dragStartOffsetY - deltaOffsetY;
        let visibleCols = canvasWidth / cellSizePx;
        let visibleRows = canvasHeight / cellSizePx;
        let maxX = Math.max(0, width - visibleCols);
        let maxY = Math.max(0, height - visibleRows);
        viewOffsetX = Math.min(maxX, Math.max(0, newOffsetX));
        viewOffsetY = Math.min(maxY, Math.max(0, newOffsetY));
        drawVisible();
        updateMinimap();
    }
    
    function onMouseUp(e) {
        if (!isDragging) return;
        isDragging = false;
        canvas.style.cursor = 'grab';
        clampViewOffset();
        drawVisible();
        updateMinimap();
    }
    
    function onWheel(e) {
        if (!canvas) return;
        e.preventDefault();
        const delta = e.deltaY > 0 ? -1 : 1;
        let newSize = cellSizePx + delta;
        if (newSize < 2) newSize = 2;
        if (newSize > 30) newSize = 30;
        if (newSize === cellSizePx) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let mouseCanvasX = (e.clientX - rect.left) * scaleX;
        let mouseCanvasY = (e.clientY - rect.top) * scaleY;
        mouseCanvasX = Math.min(canvasWidth, Math.max(0, mouseCanvasX));
        mouseCanvasY = Math.min(canvasHeight, Math.max(0, mouseCanvasY));
        let worldX = viewOffsetX + mouseCanvasX / cellSizePx;
        let worldY = viewOffsetY + mouseCanvasY / cellSizePx;
        cellSizePx = newSize;
        document.getElementById('cellSizeSlider').value = cellSizePx;
        document.getElementById('cellSizeValue').innerText = cellSizePx + 'px';
        let newOffsetX = worldX - mouseCanvasX / cellSizePx;
        let newOffsetY = worldY - mouseCanvasY / cellSizePx;
        let visibleCols = canvasWidth / cellSizePx;
        let visibleRows = canvasHeight / cellSizePx;
        let maxX = Math.max(0, width - visibleCols);
        let maxY = Math.max(0, height - visibleRows);
        viewOffsetX = Math.min(maxX, Math.max(0, newOffsetX));
        viewOffsetY = Math.min(maxY, Math.max(0, newOffsetY));
        clampViewOffset();
        drawVisible();
        updateMinimap();
    }
    
    function bindCanvasEvents() {
        if (!canvas) return;
        canvas.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        canvas.addEventListener('wheel', onWheel, { passive: false });
        canvas.style.cursor = 'grab';
        // 触摸屏支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let mouseX = (touch.clientX - rect.left) * scaleX;
            let mouseY = (touch.clientY - rect.top) * scaleY;
            mouseX = Math.min(canvasWidth, Math.max(0, mouseX));
            mouseY = Math.min(canvasHeight, Math.max(0, mouseY));
            isDragging = true;
            dragStartX = mouseX;
            dragStartY = mouseY;
            dragStartOffsetX = viewOffsetX;
            dragStartOffsetY = viewOffsetY;
            canvas.style.cursor = 'grabbing';
        });
        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let currentX = (touch.clientX - rect.left) * scaleX;
            let currentY = (touch.clientY - rect.top) * scaleY;
            currentX = Math.min(canvasWidth, Math.max(0, currentX));
            currentY = Math.min(canvasHeight, Math.max(0, currentY));
            let deltaX = currentX - dragStartX;
            let deltaY = currentY - dragStartY;
            let deltaOffsetX = deltaX / cellSizePx;
            let deltaOffsetY = deltaY / cellSizePx;
            let newOffsetX = dragStartOffsetX - deltaOffsetX;
            let newOffsetY = dragStartOffsetY - deltaOffsetY;
            let visibleCols = canvasWidth / cellSizePx;
            let visibleRows = canvasHeight / cellSizePx;
            let maxX = Math.max(0, width - visibleCols);
            let maxY = Math.max(0, height - visibleRows);
            viewOffsetX = Math.min(maxX, Math.max(0, newOffsetX));
            viewOffsetY = Math.min(maxY, Math.max(0, newOffsetY));
            drawVisible();
            updateMinimap();
        });
        canvas.addEventListener('touchend', (e) => {
            isDragging = false;
            canvas.style.cursor = 'grab';
            clampViewOffset();
            drawVisible();
            updateMinimap();
        });
    }
    
    // ---------- 初始化主世界 ----------
    function initializeGame() {
        let newWidth = parseInt(document.getElementById("width").value);
        let newHeight = parseInt(document.getElementById("height").value);
        if (isNaN(newWidth)) newWidth = 200;
        if (isNaN(newHeight)) newHeight = 200;
        newWidth = Math.min(2000, Math.max(10, newWidth));
        newHeight = Math.min(2000, Math.max(10, newHeight));
        width = newWidth;
        height = newHeight;
        grid = createGrid(width, height);
        // 随机一点生命
        for (let i = 0; i < width * height * 0.1; i++) {
            let x = Math.floor(Math.random() * width);
            let y = Math.floor(Math.random() * height);
            if (grid[y]) grid[y][x] = 1;
        }
        viewOffsetX = 0;
        viewOffsetY = 0;
        resizeCanvas();
        clampViewOffset();
        drawVisible();
        isPaused = false;
        stopGameLoop();
        restartGameLoop();
        resizeMinimap();      // 重新计算小地图比例
        updateMinimap();
    }
    
    function onWindowResize() {
        if (!canvas) return;
        resizeCanvas();
        clampViewOffset();
        drawVisible();
        updateMinimap();
    }
    
    // 键盘事件：F键全屏
    function onKeyDown(e) {
        if (e.key === 'f' || e.key === 'F') {
            e.preventDefault();
            toggleFullscreen();
        }
    }
    
    // 页面启动
    window.onload = () => {
        canvas = document.getElementById("gameCanvas");
        ctx = canvas.getContext("2d");
        minimapCanvas = document.getElementById("minimapCanvas");
        minimapCtx = minimapCanvas.getContext("2d");
        
        width = 200;
        height = 200;
        grid = createGrid(width, height);
        // 滑翔机示例
        if (width > 20 && height > 20) {
            const glider = [[0,1,0],[0,0,1],[1,1,1]];
            for (let i = 0; i < 3; i++)
                for (let j = 0; j < 3; j++)
                    if (glider[i][j]) grid[5+i][5+j] = 1;
            for (let i = 0; i < 300; i++) {
                let x = Math.floor(Math.random() * width);
                let y = Math.floor(Math.random() * height);
                if (grid[y]) grid[y][x] = 1;
            }
        }
        
        cellSizePx = 6;
        document.getElementById('cellSizeSlider').value = cellSizePx;
        document.getElementById('cellSizeValue').innerText = cellSizePx + 'px';
        showGridLines = true;
        document.getElementById('toggleGridCheckbox').checked = true;
        
        resizeCanvas();
        bindCanvasEvents();
        resizeMinimap();
        updateMinimap();
        clampViewOffset();
        drawVisible();
        
        stopGameLoop();
        restartGameLoop();
        
        window.addEventListener('resize', onWindowResize);
        document.addEventListener('keydown', onKeyDown);
        
        // 全屏按钮事件
        const fullBtn = document.getElementById('fullscreenBtn');
        if (fullBtn) fullBtn.addEventListener('click', toggleFullscreen);
        
        // 小地图点击跳转
        minimapCanvas.addEventListener('click', onMinimapClick);
    };
    
    // 暴露全局函数
    window.initializeGame = initializeGame;
    window.randomizeGrid = randomizeGrid;
    window.pauseGame = pauseGame;
    window.clearGrid = clearGrid;
    window.updateSpeed = updateSpeed;
    window.setCellSize = setCellSize;
    window.toggleGridLines = toggleGridLines;
    window.resetView = resetView;
</script>
</body>
</html>

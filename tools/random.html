<style>
  .random-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  .inputs-wrapper {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    width: 100%;
    margin-bottom: 20px;
  }
  .random-container input[type="text"] {
    width: 100%;
  }
  #result {
    margin-top: 20px;
    padding: 15px;
    background-color: var(--background-color);
    border-radius: 4px;
    min-width: 250px;
    text-align: center;
    font-size: 1.2em;
    font-weight: bold;
  }
  .slider {
    width: 200px;
    margin: 10px 0;
  }
</style>

<div class="random-container">
  <label for="count">Number of Inputs:</label>
  <input type="range" id="count" name="count" min="2" max="16" value="2" class="slider" oninput="updateInputFields()">

  <div class="inputs-wrapper" id="inputs"></div>

  <div>
    <button class="button button--outline-success button--rounded" onclick="selectRandomString()">Select Random</button>
    <button class="button button--outline-info button--rounded" id="random-binary" onclick="toggleBinary()">Click to Randomly Show 0 or 1</button>
  </div>

  <div id="result">Waiting...</div>
</div>

<script>
        function updateInputFields() {
            const num = document.getElementById('count').value;
            const container = document.getElementById('inputs');
            container.innerHTML = '';
            container.classList.toggle('few-inputs', num < 4);
            for (let i = 0; i < num; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'my-input';
                input.placeholder = `Input String ${i + 1}`;
                container.appendChild(input);
            }
        }

        function selectRandomString() {
            const inputs = document.querySelectorAll('#inputs input');
            const strings = Array.from(inputs).map(input => input.value).filter(value => value.trim() !== '');
            if (strings.length === 0) {
                alert('Please enter at least one valid string');
                return;
            }
            const randomIndex = Math.floor(Math.random() * strings.length);
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = `Randomly Selected String: ${strings[randomIndex]}`;
        }

        function toggleBinary() {
            const randomBinary = Math.round(Math.random());
            const binaryButton = document.getElementById('random-binary');
            binaryButton.textContent = `${randomBinary}`;
        }

        updateInputFields();
        toggleBinary();
    </script>
